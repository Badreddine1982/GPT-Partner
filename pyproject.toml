[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpt-partner"
version = "0.1.0"
description = "A small, governed MCP entry point for GPT Partner experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
